[package]
name = "southpaw-audio"
version = "0.1.1"
edition = "2021"
authors = ["The gbakit Authors"]
description = "Pure Rust, zero-dependency parser, software synthesizer, and byte-exact golden-tested emulator for the Southpaw GBA Sound Engine"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jidoughost-tl/southpaw-audio-rs"
keywords = ["gba", "southpaw", "audio", "synthesizer", "emulator"]
categories = ["multimedia::audio", "emulators", "no-std"]

[dependencies]

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[dev-dependencies]

[[bench]]
name = "bench_audio"
harness = false
